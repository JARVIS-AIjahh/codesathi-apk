name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "CodeSathi project id (8 chars)"
        required: true
      app_name:
        description: "App name"
        required: true
      start_url:
        description: "Published app path, e.g. /s/abcd1234"
        required: true
      manifest_url:
        description: "Web app manifest URL"
        required: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK (cmdline-tools, build-tools 34, platform 34)
        run: |
          set -euo pipefail
          export SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "build-tools;34.0.0" "platforms;android-34" >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          ls "$SDK"

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.CODESATHI_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "::error::CODESATHI_KEYSTORE_B64 secret missing" && exit 1)
          echo "$KEYSTORE_B64" | base64 -d > android.keystore

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap (skip JDK/SDK prompts)
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Write TWA manifest (no interactive init)
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
          START_URL: ${{ inputs.start_url }}
          MANIFEST_URL: ${{ inputs.manifest_url }}
        run: |
          node -e '
            const fs = require("fs");
            const H = "codesathi.codesathi-app.workers.dev";
            const O = "https://" + H;
            const name = process.env.APP_NAME.slice(0, 50);
            const m = {
              packageId: "app.codesathi." + process.env.APP_ID,
              host: H,
              name: name,
              launcherName: name.slice(0, 12),
              display: "standalone",
              themeColor: "#0b1220",
              themeColorDark: "#0b1220",
              navigationColor: "#0b1220",
              navigationColorDark: "#0b1220",
              navigationDividerColor: "#0b1220",
              navigationDividerColorDark: "#0b1220",
              backgroundColor: "#0b1220",
              enableNotifications: false,
              startUrl: process.env.START_URL,
              iconUrl: O + "/icon-512.png",
              maskableIconUrl: O + "/icon-512-maskable.png",
              appVersion: "1.0.0",
              appVersionCode: 1,
              signingKey: { path: "./android.keystore", alias: "codesathi" },
              splashScreenFadeOutDuration: 300,
              fallbackType: "customtabs",
              features: {},
              webManifestUrl: process.env.MANIFEST_URL,
              fullScopeUrl: O + "/s/" + process.env.APP_ID,
              orientation: "default",
              generatorApp: "bubblewrap-cli",
              isChromeOSOnly: false,
              isMetaQuest: false,
              shortcuts: [],
              additionalTrustedOrigins: [],
              retainedBundles: [],
              minSdkVersion: 21,
              enableSiteSettingsShortcut: false
            };
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2));
          '
          cat twa-manifest.json

      - name: Regenerate Android project from manifest
        run: bubblewrap update --skipVersionUpgrade

      - name: Build signed APK + AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.CODESATHI_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.CODESATHI_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Publish APK to repo (direct download link)
        env:
          APP_ID: ${{ inputs.app_id }}
        run: |
          set -euo pipefail
          APK=$(find . -name "app-release-signed.apk" -not -path "*/node_modules/*" | head -1)
          AAB=$(find . -name "app-release-bundle.aab" -not -path "*/node_modules/*" | head -1)
          test -n "$APK" || (echo "::error::APK not found" && find . -name "*.apk" && exit 1)
          mkdir -p apks
          cp "$APK" "apks/${APP_ID}.apk"
          if [ -n "$AAB" ]; then cp "$AAB" "apks/${APP_ID}.aab"; fi
          git config user.name "codesathi-bot"
          git config user.email "bot@codesathi.local"
          git add "apks/${APP_ID}.apk"
          if [ -n "$AAB" ]; then git add "apks/${APP_ID}.aab"; fi
          git commit -m "APK build for ${APP_ID} [skip ci]" || echo "nothing to commit"
          git push

      - name: Shred keystore
        if: always()
        run: rm -f android.keystore
