name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "CodeSathi project id (8 chars)"
        required: true
      app_name:
        description: "App name"
        required: true
      start_url:
        description: "Published app path, e.g. /s/abcd1234"
        required: true
      manifest_url:
        description: "Web app manifest URL"
        required: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses (runner has SDK preinstalled)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.CODESATHI_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "::error::CODESATHI_KEYSTORE_B64 secret missing" && exit 1)
          echo "$KEYSTORE_B64" | base64 -d > android.keystore

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap (skip JDK/SDK prompts)
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Init TWA project from web manifest
        run: printf '\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n' | bubblewrap init --manifest "${{ inputs.manifest_url }}" --directory .

      - name: Apply app identity
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
          START_URL: ${{ inputs.start_url }}
          MANIFEST_URL: ${{ inputs.manifest_url }}
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            const id = process.env.APP_ID;
            m.packageId = "app.codesathi." + id;
            m.name = process.env.APP_NAME.slice(0, 50);
            m.launcherName = process.env.APP_NAME.slice(0, 12);
            m.host = "codesathi.codesathi-app.workers.dev";
            m.startUrl = process.env.START_URL;
            m.webManifestUrl = process.env.MANIFEST_URL;
            m.iconUrl = "https://codesathi.codesathi-app.workers.dev/icon-512.png";
            m.maskableIconUrl = "https://codesathi.codesathi-app.workers.dev/icon-512-maskable.png";
            m.signingKey = { path: "./android.keystore", alias: "codesathi" };
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2));
          '
          cat twa-manifest.json

      - name: Regenerate Android project from manifest
        run: bubblewrap update --skipVersionUpgrade

      - name: Build signed APK + AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.CODESATHI_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.CODESATHI_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Publish APK to repo (direct download link)
        env:
          APP_ID: ${{ inputs.app_id }}
        run: |
          set -euo pipefail
          APK=$(find . -name "app-release-signed.apk" -not -path "*/node_modules/*" | head -1)
          AAB=$(find . -name "app-release-bundle.aab" -not -path "*/node_modules/*" | head -1)
          test -n "$APK" || (echo "::error::APK not found" && find . -name "*.apk" && exit 1)
          mkdir -p apks
          cp "$APK" "apks/${APP_ID}.apk"
          if [ -n "$AAB" ]; then cp "$AAB" "apks/${APP_ID}.aab"; fi
          git config user.name "codesathi-bot"
          git config user.email "bot@codesathi.local"
          git add "apks/${APP_ID}.apk"
          if [ -n "$AAB" ]; then git add "apks/${APP_ID}.aab"; fi
          git commit -m "APK build for ${APP_ID} [skip ci]" || echo "nothing to commit"
          git push

      - name: Shred keystore
        if: always()
        run: rm -f android.keystore
